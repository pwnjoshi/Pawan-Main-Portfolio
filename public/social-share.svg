      <stop offset="0%" stop-color="#050505" />
      <stop offset="45%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 260) rotate(45) scale(420 420)">
